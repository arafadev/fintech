spring.config.import=optional:file:.env[.properties]

spring.application.name=fintech

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.port=${PORT}

# JWT
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}

# App Properties
app.seed.admin.email=${ADMIN_EMAIL:admin@fintech.local}
app.seed.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.seed.admin.first-name=${ADMIN_FIRST_NAME:System}
app.seed.admin.last-name=${ADMIN_LAST_NAME:Admin}
app.seed.admin.phone=${ADMIN_PHONE:01000000000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.limits.daily-outgoing=${DAILY_OUTGOING_LIMIT:50000.00}
app.limits.max-single-amount=${MAX_SINGLE_AMOUNT:10000.00}

app.upload.profile-dir=${PROFILE_UPLOAD_DIR:./uploads/profile-picture}
app.upload.max-file-size-bytes=${PROFILE_MAX_FILE_SIZE_BYTES:5242880}

# Multipart upload limits (must be >= app.upload.max-file-size-bytes)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:6MB}

app.account.number-prefix=${ACCOUNT_NUMBER_PREFIX:66}
app.account.number-length=${ACCOUNT_NUMBER_LENGTH:8}

app.password.reset.link=${PASSWORD_RESET_LINK:http://localhost:3000/reset-password?code=}
app.password.reset.expiry-hours=${PASSWORD_RESET_EXPIRY_HOURS:5}

#AWS CONFIG
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKey=${AWS_SECRET_KEY}
aws.region=eu-north-1
aws.s3.bucketName=${AWS_BUCKET_NAME}
