spring.application.name=fintech
  
  # ===============================
  # DATABASE
  # ===============================
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  
  # ===============================
  # JPA / HIBERNATE
  # ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
  
  # ===============================
  # SERVER
  # ===============================
server.port=${PORT}
  
  # ===============================
  # JWT
  # ===============================
jwt.secret.string=${jwt.secret.string}
jwt.expiration.time=${JWT_EXPIRATION_TIME}
  
  # ===============================
  # MAIL
  # ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


  # ===============================
  # AWS CONFIG
  # ===============================
aws.accessKeyId=
aws.secretAccesske=
aws.region=
aws.s3.buketName=
