# Define the collection of application services (containers)
services:
  
  # Define the main service for the backend application
  app:
    
    # Configure the build parameters for the service image
    build: 
      # Set the current directory as the build context
      context: .
      
      # Specify the Dockerfile name inside the context
      dockerfile: Dockerfile    
        
    # Map external host port 8090 to internal container port 8090
    ports:
      - "8090:8090"
      
    # Set restart policy to automatically restart the container unless explicitly stopped
    restart: unless-stopped
    
    # Inject sensitive environment variables into the container from the local .env file
    env_file:
      - .env